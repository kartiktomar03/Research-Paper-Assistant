services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_LOCAL_PATH: /app/data/qdrant
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  app_data:
  app_uploads:
